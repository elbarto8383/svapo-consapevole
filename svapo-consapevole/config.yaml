name: Svapo Consapevole
version: "0.1.0"
slug: svapo_consapevole
description: Sessioni di svapo a ritmo di sigaretta vera, con notifiche sul telefono
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:timer-sand
panel_title: Svapo
homeassistant_api: true
options:
  notify_services: []
  notify_start: true
  notify_end: true
  notify_ready: true
  interruption_level: time-sensitive
schema:
  notify_services:
    - str
  notify_start: bool
  notify_end: bool
  notify_ready: bool
  interruption_level: list(active|time-sensitive)
