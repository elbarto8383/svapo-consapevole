name: Svapo Consapevole
version: "0.4.0"
slug: svapo_consapevole
description: Sessioni di svapo a ritmo di sigaretta vera, con notifiche a pulsanti sul telefono e sul Watch
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:timer-sand
panel_title: Svapo
homeassistant_api: true
options:
  notify_services: []
  reminder_minutes: 3
  start_reminders: 3
  end_reminders: 10
  interruption_level: time-sensitive
schema:
  notify_services:
    - str
  reminder_minutes: int(1,30)?
  start_reminders: int(0,20)?
  end_reminders: int(0,30)?
  interruption_level: list(active|time-sensitive)?
