ports_description:
  8099/tcp: Accesso diretto (link a parte, Home dell'iPhone)
options:
  direct_access: false
  notify_services: []
  notify_start: true
  notify_end: true
  notify_ready: true
  interruption_level: time-sensitive
schema:
  direct_access: bool?
  notify_services:
    - str
  notify_start: bool
  notify_end: bool
  notify_ready: bool
  interruption_level: list(active|time-sensitive)
