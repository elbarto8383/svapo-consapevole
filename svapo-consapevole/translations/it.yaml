configuration:
  notify_services:
    name: Dispositivi per le notifiche
    description: >-
      Nomi dei servizi notify dei telefoni, ad esempio mobile_app_il_mio_iphone.
      Li trovi in Strumenti per sviluppatori, Azioni, cercando notify.mobile_app.
  reminder_minutes:
    name: Minuti tra un promemoria e l'altro
    description: Ogni quanto ti ricordo di rispondere se non tocchi il pulsante.
  start_reminders:
    name: Promemoria per iniziare
    description: >-
      Quanti promemoria mando se non tocchi Inizia. Finiti quelli, la sessione non parte
      e aspetto la prossima pausa.
  end_reminders:
    name: Promemoria per confermare la fine
    description: >-
      Quanti promemoria mando se non rispondi a Hai finito. Finiti quelli, chiudo io
      la sessione e parte la pausa.
  interruption_level:
    name: Livello di interruzione (iPhone)
    description: >-
      Con time-sensitive la notifica arriva anche con una Modalità Focus attiva.
      Con active segue le regole normali.
